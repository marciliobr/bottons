<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bottons 32 mm — A4</title>
  <link rel="stylesheet" href="css/sheet.css">
</head>
<body>
  <header class="toolbar">
    <h1>Bottons 32 mm</h1>
    <div class="toolbar-actions">
      <label class="size-field" for="size">Tamanho
        <select id="size">
          <option value="32">32 mm</option>
          <option value="44">44 mm</option>
          <option value="58">58 mm</option>
        </select>
      </label>
      <button type="button" id="print">Imprimir</button>
      <button type="button" id="clear">Limpar tudo</button>
    </div>
  </header>
  <main class="stage">
    <div class="sheet-sizer">
      <div class="sheet" id="sheet"></div>
    </div>
  </main>
  <script src="js/sheet.js"></script>
</body>
</html>
