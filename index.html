<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>May Bottons</title>
  <meta name="description" content="Folha A4 para montar e imprimir bottons de 32, 44 e 58 mm.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:site_name" content="May Bottons">
  <meta property="og:title" content="May Bottons">
  <meta property="og:description" content="Folha A4 para montar e imprimir bottons de 32, 44 e 58 mm.">
  <meta property="og:url" content="https://marciliobr.github.io/bottons/">
  <meta property="og:image" content="https://marciliobr.github.io/bottons/og.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Botton com um gatinho ruivo, o ícone do May Bottons">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="May Bottons">
  <meta name="twitter:description" content="Folha A4 para montar e imprimir bottons de 32, 44 e 58 mm.">
  <meta name="twitter:image" content="https://marciliobr.github.io/bottons/og.jpg">
  <meta name="theme-color" content="#faf8f5">
  <script>
    try {
      if (localStorage.getItem("may-bottons-theme") === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    } catch (e) {}
  </script>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="May Bottons">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/sheet.css">
</head>
<body>
  <header class="toolbar">
    <div class="brand">
      <img class="logo" src="icons/logo.png" alt="" width="40" height="40">
      <div>
        <h1>
          <span class="wordmark"><span class="wordmark-may">May</span> <span class="wordmark-name">Bottons</span></span>
          <span class="size-pill" id="size-mark">32 mm</span>
        </h1>
        <p id="count">0 de 24 · corte 44 mm</p>
      </div>
      <button type="button" id="theme" class="theme-toggle" aria-pressed="false" aria-label="Usar tema escuro" title="Tema escuro">
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15.5 3.5a8.5 8.5 0 1 0 5 14.5A7 7 0 0 1 15.5 3.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3.5" fill="none" stroke="currentColor" stroke-width="1.7"/>
          <path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M6 6l1.6 1.6M16.4 16.4 18 18M18 6l-1.6 1.6M7.6 16.4 6 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <div class="toolbar-actions">
      <div class="sizes" role="group" aria-label="Tamanho">
        <button type="button" data-size="32" aria-pressed="true">32</button>
        <button type="button" data-size="44" aria-pressed="false">44</button>
        <button type="button" data-size="58" aria-pressed="false">58</button>
        <button type="button" data-size="livre" aria-pressed="false">Livre</button>
      </div>
      <div class="add-menu" id="add-sizes" hidden>
        <button type="button" class="add-toggle" id="add-toggle" aria-expanded="false" aria-haspopup="menu">
          <span class="add-plus" aria-hidden="true">+</span>
          Adicionar
        </button>
        <div class="add-panel" id="add-panel" role="menu" hidden>
          <button type="button" data-add="32" role="menuitem" aria-label="Adicionar botton de 32 mm">
            <span class="add-dot add-dot-32" aria-hidden="true"></span>
            <span>32 mm</span>
          </button>
          <button type="button" data-add="44" role="menuitem" aria-label="Adicionar botton de 44 mm">
            <span class="add-dot add-dot-44" aria-hidden="true"></span>
            <span>44 mm</span>
          </button>
          <button type="button" data-add="58" role="menuitem" aria-label="Adicionar botton de 58 mm">
            <span class="add-dot add-dot-58" aria-hidden="true"></span>
            <span>58 mm</span>
          </button>
        </div>
      </div>
      <div class="view-zoom" role="group" aria-label="Zoom da folha">
        <button type="button" id="view-out" aria-label="Reduzir a folha">−</button>
        <button type="button" id="view-fit" title="Ajustar à tela">100%</button>
        <button type="button" id="view-in" aria-label="Ampliar a folha">+</button>
      </div>
      <button type="button" id="undo" disabled>Desfazer</button>
      <button type="button" id="clear">Limpar tudo</button>
      <button type="button" id="install" hidden>Instalar</button>
      <button type="button" id="print">Imprimir</button>
    </div>
  </header>
  <main class="stage">
    <div class="sheet-sizer">
      <div class="sheet" id="sheet"></div>
    </div>
  </main>
  <aside class="inspector" id="inspector" hidden>
    <div class="inspector-head">
      <p class="inspector-hint" id="inspector-hint"></p>
      <button type="button" class="inspector-close" id="inspector-close" aria-label="Fechar edição">×</button>
    </div>
    <div class="inspector-actions">
      <button type="button" id="replace">Trocar</button>
      <button type="button" id="adjust">Mover</button>
      <button type="button" id="remove">Remover</button>
      <button type="button" id="center">Redefinir</button>
    </div>
    <div class="inspector-fields">
      <label class="tone-field" for="zoom">
        <span>Zoom</span>
        <output id="zoom-value" for="zoom">100%</output>
        <input type="range" id="zoom" min="0.25" max="4" step="0.01" value="1">
      </label>
      <div class="tone-field tone-rotate">
        <span id="rotation-label">Rotação</span>
        <output id="rotation-value" for="rotation">0°</output>
        <div class="rotate-line">
          <button type="button" id="rotate-left" aria-label="Girar 90° para a esquerda">↺</button>
          <input type="range" id="rotation" min="0" max="360" step="1" value="0" aria-labelledby="rotation-label">
          <button type="button" id="rotate-right" aria-label="Girar 90° para a direita">↻</button>
        </div>
      </div>
      <label class="tone-field" for="brightness">
        <span>Brilho</span>
        <output id="brightness-value" for="brightness">100%</output>
        <input type="range" id="brightness" min="0.4" max="1.8" step="0.01" value="1">
      </label>
      <label class="tone-field" for="saturation">
        <span>Saturação</span>
        <output id="saturation-value" for="saturation">100%</output>
        <input type="range" id="saturation" min="0" max="2" step="0.01" value="1">
      </label>
    </div>
  </aside>
  <script src="js/sheet.js"></script>
</body>
</html>
